name: Frontend and Android test APK
on:
  push:
    paths:
      - 'frontend/app/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/app/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: frontend/app
        run: flutter pub get
      - name: Analyze
        working-directory: frontend/app
        run: flutter analyze
      - name: Run tests
        working-directory: frontend/app
        run: flutter test
      - name: Build Android debug APK
        working-directory: frontend/app
        run: flutter build apk --debug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: puzzleverse-android-test-apk
          path: frontend/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
